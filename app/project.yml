# XcodeGen spec for the watch app. Generate the Xcode project with:
#   cd app && xcodegen
name: RetroWatch
options:
  bundleIdPrefix: com.thestouch
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RetroWatch:
    type: application
    platform: watchOS
    sources:
      - path: RetroWatch
      - path: ../port
        excludes:
          - "**/*.md"
      # The N64 display list interpreter, used as-is from the PC port.
      - path: ../external/sm64-port/src/pc/gfx/gfx_pc.c
      - path: ../external/sm64-port/src/pc/gfx/gfx_cc.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thestouch.retrowatch
        PRODUCT_NAME: RetroWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RetroWatch
        INFOPLIST_KEY_WKWatchOnly: YES
        SWIFT_OBJC_BRIDGING_HEADER: RetroWatch/RetroWatch-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../port/include
          - $(SRCROOT)/../external/sm64-port/include
          - $(SRCROOT)/../external/sm64-port/src
          - $(SRCROOT)/../external/sm64-port/src/pc
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - F3DEX_GBI_2E
          - _LANGUAGE_C
          - NON_MATCHING
          - AVOID_UB
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_OPTIMIZATION_LEVEL: "3"
        # gfx_pc.c is upstream code; its warnings are not ours to fix.
        WARNING_CFLAGS: -Wno-unused-variable
        CODE_SIGN_STYLE: Automatic
